<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GenAI RAG LLM</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/favicon.ico">
</head>
<body>
  <div id="app">
    <header>
      <h1>GenAI RAG Conversational AI System</h1>
      <p class="subtitle">Adaptive LLM Core • Fast Quantized Intelligence • Precision‑Tuned Engine</p>
    </header>

    <main>
      <div id="chat" class="chat-box"></div>

      <div class="input-row">
        <input id="input" type="text" placeholder="Ask something...">
        <button id="send">Send</button>
      </div>

      <div id="status" class="status"></div>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
